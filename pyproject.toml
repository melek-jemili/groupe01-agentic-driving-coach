[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agentic-driving-coach"
version = "1.0.0"
description = "Embodied AI Lab - Agentic Driving Coach"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10,<3.14"
authors = [{ name = "ASU KIM Lab, Arizona State University" }]
dependencies = [
    "xronos==0.13.1",
    "matplotlib>=3.8",
    "ollama>=0.4",
    "tomli>=2.0; python_version < '3.11'",
]

[project.scripts]
agentic-driving-coach = "agentic_driving_coach.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
